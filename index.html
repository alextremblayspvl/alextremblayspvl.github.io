<!DOCTYPE html>
<!-- saved from url=(0031)https://hello.alextremblay.com/ -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252"><title>Hello World</title></head>
  <body>
    <h1>Hello World</h1>
    <p id="timing">Page loaded in 84 ms</p>

    <script>
      window.addEventListener('load', () => {
        const t = performance.getEntriesByType('navigation')[0];
        const ms = Math.round(t.responseEnd - t.startTime);
        document.getElementById('timing').textContent = 'Page loaded in ' + ms + ' ms';
      });
    </script>
  

</body></html>
